services:
  db:
    # pgvector, not plain postgres:17 — the migration runs CREATE EXTENSION vector and the
    # memories.Embedding column is halfvec(3072). See docs/pgvector-halfvec-search.md.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory_mcp
      POSTGRES_USER: memory_mcp
      POSTGRES_PASSWORD: memory_mcp
    ports:
      - "5432:5432"
    volumes:
      - memory_mcp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_mcp -d memory_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=memory_mcp;Username=memory_mcp;Password=memory_mcp"
      ASPNETCORE_URLS: "http://+:8080"
      Extraction__Provider: "${EXTRACTION_PROVIDER:-OpenAI}"
      Extraction__ApiKey: "${EXTRACTION_API_KEY:-}"
      Extraction__Model: "${EXTRACTION_MODEL:-gpt-4o-mini}"
      Embeddings__Provider: "${EMBEDDINGS_PROVIDER:-Gemini}"
      Embeddings__ApiKey: "${EMBEDDINGS_API_KEY:-}"
      Embeddings__Model: "${EMBEDDINGS_MODEL:-gemini-embedding-001}"
    ports:
      - "8080:8080"
    networks:
      default:
      librechat:
        aliases:
          - memory-mcp

volumes:
  memory_mcp_db_data:

networks:
  librechat:
    external: true
