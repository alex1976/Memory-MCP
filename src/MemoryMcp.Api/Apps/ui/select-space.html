<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Space</title>
<style>
  :root {
    --bg: #1e1e1e; --surface: #252526; --surface2: #2d2d30;
    --border: #3c3c3c; --text: #cccccc; --muted: #858585;
    --accent: #0078d4; --success: #4ec9b0; --warning: #ddb76f; --danger: #f14c4c;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --surface: #f8f8f8; --surface2: #f0f0f0; --border: #e0e0e0; --text: #1e1e1e; --muted: #666666; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 12px/1.5 var(--font); background: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .title { font-size: 14px; font-weight: 600; }
  .space-list { display: flex; flex-direction: column; gap: 6px; }
  .space-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .space-card:hover { border-color: var(--accent); }
  .space-card.active { border-color: var(--success); background: var(--surface2); }
  .space-name { font-weight: 600; }
  .space-key { color: var(--muted); font-size: 11px; }
  .space-meta { color: var(--muted); font-size: 10px; text-align: right; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; background: var(--success); color: #06281f; font-weight: 600; }
  .status-bar { font-size: 10px; color: var(--muted); }
  .status-bar.error { color: var(--danger); }
  .status-bar.success { color: var(--success); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <div class="title">🗂️ Select Active Space</div>
  <div class="space-list" id="spaceList"><div class="empty">Loading spaces…</div></div>
  <div class="status-bar" id="statusBar">Ready</div>

  <script>
    let nextRequestId = 1;
    const pendingRequests = new Map();
    function sendRequest(method, params) {
      const id = nextRequestId++;
      return new Promise((resolve, reject) => {
        pendingRequests.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params: params || {} }, '*');
      });
    }
    function sendNotification(method, params) {
      window.parent.postMessage({ jsonrpc: '2.0', method, params: params || {} }, '*');
    }
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || msg.jsonrpc !== '2.0' || msg.id === undefined) return;
      if (!pendingRequests.has(msg.id)) return;
      const { resolve, reject } = pendingRequests.get(msg.id);
      pendingRequests.delete(msg.id);
      msg.error ? reject(new Error(msg.error.message || JSON.stringify(msg.error))) : resolve(msg.result);
    });

    function setStatus(text, type) {
      const el = document.getElementById('statusBar');
      el.textContent = text;
      el.className = 'status-bar' + (type ? ` ${type}` : '');
    }

    function renderSpaces(spaces) {
      const list = document.getElementById('spaceList');
      if (!spaces || spaces.length === 0) {
        list.innerHTML = '<div class="empty">No accessible spaces.</div>';
        return;
      }
      list.innerHTML = '';
      spaces.forEach((s) => {
        const card = document.createElement('div');
        card.className = 'space-card' + (s.isDefault ? ' active' : '');
        card.innerHTML = `
          <div>
            <div class="space-name">${escapeHtml(s.name)}</div>
            <div class="space-key">${escapeHtml(s.key)}</div>
          </div>
          <div class="space-meta">
            ${s.isDefault ? '<span class="badge">Active</span>' : ''}
            <div>${s.documentCount} docs · ${s.memoryCount} memories</div>
          </div>`;
        card.addEventListener('click', () => selectSpace(s.key));
        list.appendChild(card);
      });
    }

    async function selectSpace(key) {
      setStatus(`Switching to "${key}"…`);
      try {
        const result = await sendRequest('tools/call', { name: 'setActiveSpace', arguments: { spaceKey: key } });
        const spaces = extractSpaces(result);
        renderSpaces(spaces);
        setStatus(`Active space is now "${key}".`, 'success');
      } catch (e) {
        setStatus('Error: ' + e.message, 'error');
      }
    }

    function extractSpaces(result) {
      if (result?.structuredContent) return result.structuredContent;
      const text = result?.content?.find(c => c.text)?.text;
      return text ? JSON.parse(text) : [];
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    async function initialize() {
      try {
        setStatus('Connecting…');
        await sendRequest('ui/initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'select-space', version: '1.0.0' } });
        sendNotification('ui/notifications/initialized', {});

        const res = await sendRequest('resources/read', { uri: 'memory-mcp://spaces' });
        const text = res?.contents?.[0]?.text;
        const spaces = text ? JSON.parse(text) : [];
        renderSpaces(spaces);
        setStatus(`Ready — ${spaces.length} space(s) available.`);
      } catch (e) {
        setStatus('Standalone mode: ' + e.message, 'error');
      }
    }

    initialize();
  </script>
</body>
</html>
